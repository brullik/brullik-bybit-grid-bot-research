[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-market-store"
version = "0.2.0"
description = "Exact canonical Parquet contracts and immutable market-store primitives"
requires-python = ">=3.12"
dependencies = ["grid-contracts==0.2.0", "pyarrow>=19,<26"]

[tool.setuptools.packages.find]
where = ["src"]
