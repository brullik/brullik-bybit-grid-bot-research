[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brullik-grid-platform-dev"
version = "0.2.0"
description = "Development tooling for the brullik Bybit grid research-to-live monorepo"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
data = [
  "duckdb>=1.2,<2",
  "polars>=1.25,<2",
  "pyarrow>=19,<26",
  "psutil>=6,<8",
]
dev = [
  "jsonschema[format]>=4.26,<5",
  "mypy>=1.15,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = [
  ".",
  "packages/contracts/src",
  "packages/bybit-public/src",
  "packages/bybit-private/src",
  "apps/data/src",
  "apps/research/src",
  "apps/release/src",
  "apps/live/src",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".benchmark-work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = [
  "packages/contracts/src",
  "packages/bybit-public/src",
  "packages/bybit-private/src",
  "apps/data/src",
  "apps/research/src",
  "apps/release/src",
  "apps/live/src",
]
